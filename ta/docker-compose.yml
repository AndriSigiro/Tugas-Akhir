services:
  yolo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo-detection-api
    restart: unless-stopped
    ports:
      - "33333:9090"
    volumes:
      # Persist uploads and database
      - ./uploads:/app/uploads
      - ./results.db:/app/results.db
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_FOLDER=/app/uploads
      - MODEL_PATH=/app/Model/best (12).pt
      - DB_NAME=/app/results.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Recommended: Limit resources for stability
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== NGROK TUNNEL ====================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-tunnel
    restart: unless-stopped
    depends_on:
      yolo-api:
        condition: service_healthy
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http yolo-api:9090 --log stdout
    ports:
      - "4040:4040"  # ngrok web interface (optional)
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
