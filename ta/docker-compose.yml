version: '3.8'

services:
  yolo-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo-detection-api
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Persist uploads and database
      - ./uploads:/app/uploads
      - ./results.db:/app/results.db
    environment:
      - PYTHONUNBUFFERED=1
      - UPLOAD_FOLDER=/app/uploads
      - MODEL_PATH=/app/Model/best (12).pt
      - DB_NAME=/app/results.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Recommended: Limit resources for stability
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
